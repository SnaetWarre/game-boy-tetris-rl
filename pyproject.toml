[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gb-tetris-rl"
version = "0.1.0"
description = "CUDA DQN training for open-source Game Boy falling-block games through PyBoy"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Warre Snaet" }]
dependencies = [
  "gymnasium>=1.3,<2",
  "numpy>=2,<3",
  "pyboy==2.7.0",
]

[project.optional-dependencies]
train = ["stable-baselines3>=2.9,<3"]
record = ["pillow>=11,<13"]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
gb-tetris-rl = "gb_tetris_rl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
