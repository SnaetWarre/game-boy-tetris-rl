[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gb-tetris-rl"
version = "0.4.0"
description = "Hold-aware spatial dueling policy training for Pandora's Blocks through PyBoy"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Warre Snaet" }]
dependencies = [
  "gymnasium>=1.3,<2",
  "numpy>=2,<3",
  "pillow>=11,<13",
  "pyboy==2.7.0",
  "stable-baselines3>=2.9,<3",
  "torch==2.13.0",
]

[dependency-groups]
dev = [
  "pyright[nodejs]>=1.1.400,<2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
gb-tetris-rl = "gb_tetris_rl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
